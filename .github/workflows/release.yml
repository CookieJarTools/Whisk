# Builds Whisk for Windows and Linux and publishes a GitHub release when a version
# tag is pushed (e.g. `npm run release -- 0.3.0`). The release includes the signed
# update files and latest.json that Whisk's updater reads.
#
# Run it by hand (Actions › Release › Run workflow) to build without releasing.
# The installers are kept as the run's artifacts.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The release starts as a draft, so nobody sees it (or updates to it) until
  # every platform's build is on it.
  draft:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match tauri.conf.json version $version"
            exit 1
          fi

      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: |
            **Windows:** download **Whisk_*_x64-setup.exe** below and run it.
            **Linux:** download **Whisk_*_amd64.AppImage**, make it executable and run it. There's also a .deb and an .rpm.

            Whisk updates itself from here afterwards.
        run: |
          # Tags like v0.3.0-beta.1 become pre-releases, offered only to people who opt in.
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" -f name="Whisk $GITHUB_REF_NAME" -f body="$NOTES" \
            -F draft=true -F prerelease=${{ contains(github.ref_name, '-') }} --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: draft
    # Also runs by hand, when there's no draft to upload to.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      # One at a time: each build adds its platform to the release's latest.json.
      max-parallel: 1
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Both empty when run by hand, which only builds.
          releaseId: ${{ needs.draft.outputs.id }}
          tagName: ${{ needs.draft.outputs.id && github.ref_name || '' }}
          includeUpdaterJson: true

      - name: Keep the installers
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: whisk-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

  publish:
    needs: [draft, build]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/${{ needs.draft.outputs.id }}" -F draft=false --silent
